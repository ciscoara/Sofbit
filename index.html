<!DOCTYPE html>
<html>
<head>
<title>Sofbit</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body, h1, h2, h3, h4, h5, h6 {
  font-family: "Raleway", sans-serif;
}

body, html {
  height: 100%;
  line-height: 1.8;
}

/* Full height image header */
.bgimg-1 {
  background-position: center;
  background-size: cover;
  background-image: url("./images/dtsantiago.jpg");
  min-height: 100%;
}

.w3-bar .w3-button {
  padding: 16px;
}

/* Navbar Logo Styling */
#myNavbar img {
  height: 50px;
}

/* Tagline styling */
.tagline {
  text-align: center;
  color: #FFFFFF;
  font-size: 3vw; /* Responsive font size */
  text-shadow: 2px 2px 4px #0b0b0b;
  margin-top: 20px;
}

/* Logo image responsiveness */
.logoim img {
  width: 100%;
  max-width: 800px;
  height: auto;
}

/* Mobile adjustments */
@media (max-width: 768px) {
  .tagline {
    font-size: 25px; /* Adjusted for smaller screens */
    width: 100%;
  text-wrap: auto;
  margin: 5px;
  
  }
  #myNavbar img {
    height: 35px;
  }

  .logoim img  {
    width: 380px;
    /* padding: auto; */
    height: auto;
    margin-top: auto;
    
  }

.map {

  width: 100%;
  height: Auto;
}


}
</style>
</head>
<body>

<!-- Navbar (sit on top) -->
<div class="w3-top">
  <div class="w3-bar w3-white w3-card" id="myNavbar">
    <a href="#home" class="w3-bar-item w3-wide"><img src="images/sofbitcropped.png" alt="Logo1"></a>
    <!-- Right-sided navbar links -->
    <div class="w3-right w3-hide-small">
      <a href="#contact" class="w3-bar-item w3-button"><i class="fa fa-envelope"></i> CONTACT</a>
    </div>
    <!-- Hide right-floated links on small screens and replace with menu icon -->
    <a href="javascript:void(0)" class="w3-bar-item w3-button w3-right w3-hide-large w3-hide-medium" onclick="w3_open()">
      <i class="fa fa-bars"></i>
    </a>
  </div>
</div>

<!-- Sidebar on small screens -->
<nav class="w3-sidebar w3-bar-block w3-black w3-card w3-animate-left w3-hide-medium w3-hide-large" style="display:none" id="mySidebar">
  <a href="javascript:void(0)" onclick="w3_close()" class="w3-bar-item w3-button w3-large w3-padding-16">Close ×</a>
  <a href="#contact" onclick="w3_close()" class="w3-bar-item w3-button">CONTACT</a>
</nav>

<!-- Header with full-height image -->
<header class="bgimg-1 w3-display-container" id="home">
  <div class="logoim w3-display-middle w3-center">
    <img src="images/sofbitcropped.png" alt="Logo">
    <div class="tagline">Chilean Code, Elevating American Innovation.</div>
  </div> 
</header>

<!-- Contact Section -->
<div class="w3-container w3-light-grey" style="padding:128px 16px" id="contact">
  <h3 class="w3-center">CONTACT</h3>
  <p class="w3-center w3-large">Work with Us. Send us a message:</p>
  <div style="margin-top:48px">
    <form action="https://formspree.io/f/xkgngvgq" method="POST">
      <p><input class="w3-input w3-border" type="text" placeholder="Name" required name="Name"></p>
      <p><input class="w3-input w3-border" type="text" placeholder="Email" required name="Email"></p>
      <p><input class="w3-input w3-border" type="text" placeholder="Subject" required name="Subject"></p>
      <p><input class="w3-input w3-border" type="text" placeholder="Message" required name="Message"></p>
      <p>
        <button class="w3-button w3-black" type="submit">
          <i class="fa fa-paper-plane"></i> SEND MESSAGE
        </button>
      </p>
    </form>
    <br>
    <p><i class="fa fa-map-marker fa-fw w3-xxlarge w3-margin-right"></i> Vitacura, Santiago, Chile</p>
    <br>
    <!-- Map Image with reduced height -->
    <img class = "map" src="images/citymap.png" style="max-width: 100%; height: auto; display: block; margin: 20px auto 0; height: 50%;">
  </div>
</div>

<!-- Footer -->
<footer class="w3-center w3-black w3-padding-64">
  <a href="#home" class="w3-button w3-light-grey"><i class="fa fa-arrow-up w3-margin-right"></i>To the top</a>
  <p>Powered by <a title="W3.CSS" target="_blank">w3.css</a></p>
</footer>

<script>
// Modal Image Gallery
function onClick(element) {
  document.getElementById("img01").src = element.src;
  document.getElementById("modal01").style.display = "block";
  var captionText = document.getElementById("caption");
  captionText.innerHTML = element.alt;
}

// Sidebar toggle functions
var mySidebar = document.getElementById("mySidebar");

function w3_open() {
  mySidebar.style.display = mySidebar.style.display === 'block' ? 'none' : 'block';
}

function w3_close() {
  mySidebar.style.display = "none";
}
</script>

</body>
</html>
